# The registry proves itself: the same suite gates PRs and runs after every automation
# commit — a registry that ships a broken entry has a red proof.
name: proofs
on:
  pull_request:
  push:
    branches: [main]

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prova-rs/run-action@v1
        with:
          # The self-proofs drive `prova plugins` — the verb landed in v0.11.0.
          version: v0.11.0
