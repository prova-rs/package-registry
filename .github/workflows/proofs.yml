# The registry proves itself: the same suite gates PRs and runs after every automation
# commit — a registry that ships a broken entry has a red proof.
name: proofs
on:
  pull_request:
  push:
    branches: [main]

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prova-rs/run-action@v1
        with:
          # The self-proofs drive `prova plugins` (v0.11.0) and read entries with `toml.decode`,
          # the format-naming rename that landed in v0.13.0. The later floor wins.
          version: v0.16.0   # the package-vocabulary line ([dependencies], packages)
